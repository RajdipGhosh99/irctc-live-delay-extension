name: Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Build, Lint & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Run Unit & Adapter Integrity Tests
        run: npm run test:unit

      - name: Build Production Bundle
        run: npm run build

      - name: Validate Packaging & Generate Checksum
        run: npm run pack

      - name: Verify Distribution Manifest
        run: |
          test -f dist/manifest.json || { echo "dist/manifest.json missing"; exit 1; }
          test -f release/SHA256SUMS.txt || { echo "checksums file missing"; exit 1; }
          echo "✅ All distribution assets verified!"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: |
            dist/
            release/train-delay-tracker-*.zip
            release/SHA256SUMS.txt
          retention-days: 14
