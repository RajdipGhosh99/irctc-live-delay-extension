name: Release Extension Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension
        run: npm run build

      - name: Package Extension ZIP
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="${{ github.event.inputs.version }}"
          fi
          cd dist
          zip -r "../train-delay-tracker-${RELEASE_TAG}.zip" .
          zip -r "../train-delay-tracker-latest.zip" .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Live Train Delay Tracker ${{ github.ref_name || github.event.inputs.version }}"
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          files: |
            train-delay-tracker-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🚆 Live Train Delay Tracker (${{ github.ref_name || github.event.inputs.version }})

            Open-source, real-time live train delay tracker and punctuality analytics for ConfirmTkt, MakeMyTrip, ClearTrip, Ixigo, Goibibo, and Paytm.

            ---

            ### 📥 Download & 30-Second Manual Installation Guide

            Works on **Google Chrome**, **Microsoft Edge**, **Brave**, **Opera**, **Vivaldi**, and all Chromium browsers (No Web Store account required).

            #### Step 1: Download
            - Download **[`train-delay-tracker-${{ github.ref_name || github.event.inputs.version }}.zip`](https://github.com/RajdipGhosh99/irctc-live-delay-extension/releases/download/${{ github.ref_name || github.event.inputs.version }}/train-delay-tracker-${{ github.ref_name || github.event.inputs.version }}.zip)** from the assets below.

            #### Step 2: Unzip
            - Extract/unzip the `.zip` archive to a folder on your computer (e.g. `Documents/train-delay-tracker`).

            #### Step 3: Load in Browser
            1. Open your browser and navigate to:
               - Chrome: `chrome://extensions/`
               - Edge: `edge://extensions/`
               - Brave: `brave://extensions/`
            2. Toggle on **Developer mode** in the top right corner.
            3. Click the **Load unpacked** button in the top left.
            4. Select the extracted folder.

            #### Step 4: Accept Terms & Track
            - Accept the Fair Personal Use Terms in the extension popup and navigate to any supported booking portal!

            ---
            *Licensed under GNU General Public License v3.0 (GPL-3.0).*
