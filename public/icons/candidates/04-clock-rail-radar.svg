<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Blue Squircle -->
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Clock Face Gradient -->
    <linearGradient id="clockFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad4)" stroke="#334155" stroke-width="4"/>

  <!-- Indian Tricolor Outer Ring Bezels -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#FF9933" stroke-width="12"/>
  <circle cx="256" cy="256" r="164" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.9"/>
  <circle cx="256" cy="256" r="154" fill="none" stroke="#138808" stroke-width="12"/>

  <!-- Central Clock White Disc -->
  <circle cx="256" cy="256" r="142" fill="url(#clockFace)"/>

  <!-- Clock Hour Ticks -->
  <g stroke="#64748B" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="126" x2="256" y2="138" /> <!-- 12 -->
    <line x1="386" y1="256" x2="374" y2="256" /> <!-- 3 -->
    <line x1="126" y1="256" x2="138" y2="256" /> <!-- 9 -->
    <line x1="348" y1="164" x2="339" y2="173" /> <!-- 1 -->
    <line x1="164" y1="164" x2="173" y2="173" /> <!-- 11 -->
  </g>

  <!-- Converging Railway Tracks (Perspective from Bottom into Clock Center) -->
  <g id="tracks">
    <!-- Left & Right Steel Rails -->
    <line x1="140" y1="430" x2="246" y2="256" stroke="#002B7F" stroke-width="9" stroke-linecap="round"/>
    <line x1="372" y1="430" x2="266" y2="256" stroke="#002B7F" stroke-width="9" stroke-linecap="round"/>
    
    <!-- Sleepers / Ties -->
    <line x1="156" y1="410" x2="356" y2="410" stroke="#002B7F" stroke-width="6" stroke-linecap="round"/>
    <line x1="175" y1="380" x2="337" y2="380" stroke="#002B7F" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="192" y1="352" x2="320" y2="352" stroke="#002B7F" stroke-width="5" stroke-linecap="round"/>
    <line x1="208" y1="326" x2="304" y2="326" stroke="#002B7F" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="222" y1="302" x2="290" y2="302" stroke="#002B7F" stroke-width="4" stroke-linecap="round"/>
    <line x1="234" y1="280" x2="278" y2="280" stroke="#002B7F" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Clock Precision Hands -->
  <!-- Hour Hand pointing to 10 o'clock -->
  <line x1="256" y1="256" x2="190" y2="200" stroke="#0F172A" stroke-width="9" stroke-linecap="round"/>
  <!-- Minute Hand pointing to 2 o'clock -->
  <line x1="256" y1="256" x2="328" y2="182" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>
  <!-- Center Cap Pin -->
  <circle cx="256" cy="256" r="10" fill="#2563EB" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Live On-Time Green Signal Indicator (2 o'clock status) -->
  <g transform="translate(345, 165)">
    <circle cx="0" cy="0" r="16" fill="#10B981" filter="url(#emeraldGlow)"/>
    <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>
  </g>
</svg>
