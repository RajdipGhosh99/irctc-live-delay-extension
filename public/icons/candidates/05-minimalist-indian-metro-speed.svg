<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="squircleClip5">
      <rect x="24" y="24" width="464" height="464" rx="112"/>
    </clipPath>
    <filter id="glowDot5" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 45-Degree Diagonal Indian Flag Speed Sash inside Squircle -->
  <g clip-path="url(#squircleClip5)">
    <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
    <!-- Saffron Upper-Left Triangle -->
    <polygon points="0,0 512,0 0,380" fill="#FF7700"/>
    <!-- Green Lower-Right Triangle -->
    <polygon points="512,132 512,512 0,512" fill="#00E676"/>
    <!-- Center White Sash Divider Lines -->
    <line x1="0" y1="380" x2="512" y2="0" stroke="#FFFFFF" stroke-width="20"/>
    <line x1="0" y1="512" x2="512" y2="132" stroke="#FFFFFF" stroke-width="20"/>
  </g>

  <!-- Squircle Border in Deep Obsidian -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#0F172A" stroke-width="12"/>

  <!-- High-Contrast Reference Train Body -->
  <g transform="translate(0, -6)">
    <!-- Roof Cap -->
    <rect x="206" y="112" width="100" height="24" rx="10" fill="#0F172A"/>
    <!-- Cabin -->
    <rect x="156" y="128" width="200" height="200" rx="36" fill="#0F172A"/>
    <!-- Windshield -->
    <rect x="178" y="148" width="156" height="74" rx="14" fill="#FFFFFF"/>

    <!-- Headlights -->
    <circle cx="198" cy="272" r="22" fill="#FFFFFF"/>
    <circle cx="198" cy="272" r="14" fill="#0F172A"/>
    <circle cx="314" cy="272" r="22" fill="#FFFFFF"/>
    <circle cx="314" cy="272" r="14" fill="#0F172A"/>

    <!-- 3 Radiator Pills in Navy -->
    <rect x="240" y="252" width="8" height="40" rx="4" fill="#003399"/>
    <rect x="252" y="248" width="8" height="48" rx="4" fill="#003399"/>
    <rect x="264" y="252" width="8" height="40" rx="4" fill="#003399"/>

    <!-- Tracks & Sleepers -->
    <polygon points="196,344 216,344 182,442 160,442" fill="#0F172A"/>
    <polygon points="296,344 316,344 352,442 330,442" fill="#0F172A"/>
    <rect x="194" y="358" width="124" height="14" rx="7" fill="#0F172A"/>
    <rect x="180" y="388" width="152" height="15" rx="7.5" fill="#0F172A"/>
    <rect x="164" y="420" width="184" height="16" rx="8" fill="#0F172A"/>
  </g>

  <!-- Glowing Live Dot Beacon at Top-Right Corner -->
  <g transform="translate(420, 92)">
    <circle cx="0" cy="0" r="32" fill="#00E676" opacity="0.35" filter="url(#glowDot5)"/>
    <circle cx="0" cy="0" r="20" fill="#00E676" stroke="#FFFFFF" stroke-width="4.5"/>
    <circle cx="-3.5" cy="-3.5" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>