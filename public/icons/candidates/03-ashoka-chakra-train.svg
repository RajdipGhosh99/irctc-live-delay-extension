<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="glow3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="saffron3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <linearGradient id="bodyGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Frame -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#0F172A" stroke-width="26"/>

  <!-- Vande Bharat Aerodynamic Bullet Nose -->
  <path d="M 256 100 
           C 200 100, 164 150, 164 220 
           L 164 326 
           C 164 344, 180 356, 200 356 
           L 312 356 
           C 332 356, 348 344, 348 326 
           L 348 220 
           C 348 150, 312 100, 256 100 Z" 
        fill="url(#bodyGrad3)"/>

  <!-- Saffron Forehead Visor Fin -->
  <path d="M 216 116 C 238 108, 274 108, 296 116 L 284 130 C 268 124, 244 124, 228 130 Z" fill="url(#saffron3)"/>

  <!-- Panoramic Dark Tint Visor Glass -->
  <path d="M 186 168 
           C 206 148, 240 142, 256 142 
           C 272 142, 306 148, 326 168 
           C 334 176, 332 198, 326 216 
           C 306 226, 274 230, 256 230 
           C 238 230, 206 226, 186 216 
           C 180 198, 178 176, 186 168 Z" 
        fill="#FFFFFF"/>

  <!-- Cyber Angular Headlights -->
  <polygon points="186,270 220,284 196,298 180,284" fill="#FFFFFF"/>
  <polygon points="326,270 292,284 316,298 332,284" fill="#FFFFFF"/>

  <!-- Cyber Aerodynamic Front Nose Line -->
  <path d="M 240 316 L 256 328 L 272 316" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- High-Speed Perspective Tracks in Neon Tricolor -->
  <polygon points="208,374 226,374 186,446 166,446" fill="#FF7700"/>
  <polygon points="286,374 304,374 346,446 326,446" fill="#00E676"/>
  <rect x="200" y="386" width="112" height="12" rx="6" fill="#0F172A"/>
  <rect x="184" y="412" width="144" height="14" rx="7" fill="#0F172A"/>
  <rect x="168" y="438" width="176" height="15" rx="7.5" fill="#0F172A"/>

  <!-- Glowing Live Dot Beacon -->
  <g transform="translate(422, 90)">
    <circle cx="0" cy="0" r="36" fill="#00E676" opacity="0.25" filter="url(#glow3)"/>
    <circle cx="0" cy="0" r="24" fill="#00E676" opacity="0.4"/>
    <circle cx="0" cy="0" r="16" fill="#00E676" stroke="#FFFFFF" stroke-width="4.5"/>
    <circle cx="-3.5" cy="-3.5" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>