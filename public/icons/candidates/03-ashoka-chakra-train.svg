<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="liveDotGlow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Indian Tricolor Circular Rim -->
  <path d="M 20 256 A 236 236 0 0 1 492 256" fill="none" stroke="#FF9933" stroke-width="28" stroke-linecap="round"/>
  <path d="M 492 256 A 236 236 0 0 1 20 256" fill="none" stroke="#138808" stroke-width="28" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#000000" stroke-width="4"/>

  <!-- Ashoka Chakra Radiating Spokes in Upper Half -->
  <g stroke="#000080" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="160" x2="256" y2="44"/>
    <line x1="225" y1="164" x2="198" y2="52"/>
    <line x1="287" y1="164" x2="314" y2="52"/>
    <line x1="196" y1="176" x2="144" y2="76"/>
    <line x1="316" y1="176" x2="368" y2="76"/>
    <line x1="172" y1="195" x2="98" y2="112"/>
    <line x1="340" y1="195" x2="414" y2="112"/>
    <line x1="154" y1="220" x2="64" y2="160"/>
    <line x1="358" y1="220" x2="448" y2="160"/>
  </g>

  <!-- Central Ashoka Wheel Hub Ring -->
  <circle cx="256" cy="256" r="140" fill="#FFFFFF" stroke="#000080" stroke-width="16"/>

  <!-- Indian Train Engine Front Silhouette Inside Hub -->
  <g id="train-symbol">
    <rect x="232" y="152" width="48" height="14" rx="6" fill="#000000"/>
    <path d="M 186 196 C 186 172, 204 162, 256 162 C 308 162, 326 172, 326 196 L 328 322 C 328 334, 318 342, 304 342 L 208 342 C 194 342, 184 334, 184 322 Z" fill="#000000"/>

    <!-- Windshield Screen -->
    <rect x="202" y="184" width="108" height="46" rx="8" fill="#FFFFFF"/>
    <rect x="252" y="184" width="8" height="46" fill="#000000"/>

    <!-- Twin Round Headlights -->
    <circle cx="216" cy="262" r="16" fill="#FFFFFF"/>
    <circle cx="296" cy="262" r="16" fill="#FFFFFF"/>

    <!-- Indian Railways 3-Bar Grill -->
    <rect x="246" y="246" width="6" height="34" rx="3" fill="#FFFFFF"/>
    <rect x="253" y="244" width="6" height="38" rx="3" fill="#FFFFFF"/>
    <rect x="260" y="246" width="6" height="34" rx="3" fill="#FFFFFF"/>

    <!-- Tricolor Chest Plate -->
    <rect x="204" y="316" width="104" height="4" fill="#FF9933" rx="1"/>
    <rect x="204" y="320" width="104" height="4" fill="#FFFFFF"/>
    <rect x="204" y="324" width="104" height="4" fill="#138808" rx="1"/>
  </g>

  <!-- Ground Tracks -->
  <polygon points="214,352 230,352 188,446 168,446" fill="#000000"/>
  <polygon points="282,352 298,352 344,446 324,446" fill="#000000"/>
  <rect x="202" y="368" width="108" height="14" rx="4" fill="#000000"/>
  <rect x="190" y="396" width="132" height="15" rx="4" fill="#000000"/>
  <rect x="176" y="424" width="160" height="16" rx="4" fill="#000000"/>

  <!-- LIVE STATUS DOT BEACON (Emerald Green Glow) -->
  <g transform="translate(410, 102)">
    <circle cx="0" cy="0" r="32" fill="#10B981" opacity="0.28" filter="url(#liveDotGlow3)"/>
    <circle cx="0" cy="0" r="22" fill="#10B981" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="-5" cy="-5" r="5" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
