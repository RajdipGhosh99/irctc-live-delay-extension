<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Live Dot Glow Filter -->
    <filter id="liveDotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Indian Tricolor Outer Border Ring -->
  <!-- Saffron Top Arc (180 deg) -->
  <path d="M 20 256 A 236 236 0 0 1 492 256" fill="none" stroke="#FF9933" stroke-width="28" stroke-linecap="round"/>
  <!-- White Separator Ring Base -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="#000000" stroke-width="4"/>
  <!-- India Green Bottom Arc (180 deg) -->
  <path d="M 492 256 A 236 236 0 0 1 20 256" fill="none" stroke="#138808" stroke-width="28" stroke-linecap="round"/>

  <!-- Top Overhead Pantograph -->
  <rect x="220" y="78" width="72" height="18" rx="8" fill="#000000"/>
  <path d="M 230 96 L 256 128 L 282 96 Z" fill="#000000"/>
  <line x1="256" y1="124" x2="256" y2="148" stroke="#000000" stroke-width="12" stroke-linecap="round"/>

  <!-- Main Locomotive Cabin Body -->
  <path d="M 172 148 C 172 136, 184 126, 198 126 L 314 126 C 328 126, 340 136, 340 148 L 348 296 C 348 310, 336 322, 322 322 L 190 322 C 176 322, 164 310, 164 296 Z" fill="#000000"/>

  <!-- Windshield Cutout (Negative Space) -->
  <rect x="188" y="152" width="136" height="54" rx="10" fill="#FFFFFF"/>
  <rect x="251" y="152" width="10" height="54" fill="#000000"/>

  <!-- Twin Big Headlights -->
  <circle cx="204" cy="242" r="19" fill="#FFFFFF"/>
  <circle cx="308" cy="242" r="19" fill="#FFFFFF"/>

  <!-- Center IR Air Grill Slits -->
  <rect x="242" y="222" width="8" height="40" rx="4" fill="#FFFFFF"/>
  <rect x="252" y="220" width="8" height="44" rx="4" fill="#FFFFFF"/>
  <rect x="262" y="222" width="8" height="40" rx="4" fill="#FFFFFF"/>

  <!-- Indian Tricolor Mini Decal Plate on Engine Front -->
  <rect x="216" y="294" width="80" height="4" fill="#FF9933" rx="1"/>
  <rect x="216" y="298" width="80" height="4" fill="#FFFFFF"/>
  <rect x="216" y="302" width="80" height="4" fill="#138808" rx="1"/>

  <!-- Converging Railway Tracks Beneath -->
  <polygon points="204,332 222,332 178,442 156,442" fill="#000000"/>
  <polygon points="290,332 308,332 356,442 334,442" fill="#000000"/>

  <!-- Track Sleepers / Ties -->
  <rect x="194" y="348" width="124" height="14" rx="4" fill="#000000"/>
  <rect x="182" y="378" width="148" height="16" rx="4" fill="#000000"/>
  <rect x="168" y="412" width="176" height="18" rx="4" fill="#000000"/>

  <!-- LIVE STATUS DOT BEACON (Emerald Green Glow at 2 o'clock) -->
  <g transform="translate(412, 100)">
    <circle cx="0" cy="0" r="32" fill="#10B981" opacity="0.28" filter="url(#liveDotGlow)"/>
    <circle cx="0" cy="0" r="22" fill="#10B981" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="-5" cy="-5" r="5" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
