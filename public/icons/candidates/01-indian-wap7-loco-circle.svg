<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="glow1" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="saffronGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <linearGradient id="greenGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B248"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Outer Circle Frame -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#0F172A" stroke-width="26"/>

  <!-- Saffron Top Roof Cap & Upper Canopy -->
  <rect x="206" y="112" width="100" height="24" rx="10" fill="url(#saffronGrad1)"/>
  <path d="M 156 180 C 156 142, 180 128, 216 128 L 296 128 C 332 128, 356 142, 356 180 L 356 200 L 156 200 Z" fill="url(#saffronGrad1)"/>

  <!-- Crisp White Middle Cockpit Band (Clean Flag Center) -->
  <rect x="156" y="200" width="200" height="74" fill="#FFFFFF" stroke="#0F172A" stroke-width="8"/>

  <!-- Navy Blue Windshield Glass & Ashoka Navy Accents -->
  <rect x="178" y="148" width="156" height="66" rx="12" fill="#0F172A"/>

  <!-- Twin Big Headlights in Middle White Band -->
  <circle cx="198" cy="242" r="22" fill="#0F172A"/>
  <circle cx="198" cy="242" r="14" fill="#FFFFFF"/>
  <circle cx="314" cy="242" r="22" fill="#0F172A"/>
  <circle cx="314" cy="242" r="14" fill="#FFFFFF"/>

  <!-- Center Ashoka Navy 3-Pill Grill -->
  <rect x="242" y="222" width="7" height="38" rx="3.5" fill="#003399"/>
  <rect x="252" y="218" width="8" height="46" rx="4" fill="#003399"/>
  <rect x="263" y="222" width="7" height="38" rx="3.5" fill="#003399"/>

  <!-- Green Lower Bumper & Cowcatcher (Bottom Flag Stripe) -->
  <path d="M 156 274 L 356 274 L 348 326 C 348 340, 334 348, 316 348 L 196 348 C 178 348, 164 340, 164 326 Z" fill="url(#greenGrad1)"/>

  <!-- Obsidian Outline Border on Train Body for High Contrast -->
  <path d="M 206 112 L 306 112 M 156 180 C 156 142, 180 128, 216 128 L 296 128 C 332 128, 356 142, 356 180 L 356 326 C 356 344, 340 354, 316 354 L 196 354 C 172 354, 156 344, 156 326 Z" fill="none" stroke="#0F172A" stroke-width="12" stroke-linejoin="round"/>

  <!-- Converging Dynamic Speed Tracks -->
  <polygon points="196,358 216,358 182,442 160,442" fill="#0F172A"/>
  <polygon points="296,358 316,358 352,442 330,442" fill="#0F172A"/>
  <rect x="194" y="368" width="124" height="14" rx="7" fill="#0F172A"/>
  <rect x="180" y="396" width="152" height="15" rx="7.5" fill="#0F172A"/>
  <rect x="164" y="424" width="184" height="16" rx="8" fill="#0F172A"/>

  <!-- Glowing Live Dot Beacon at 2 o'clock -->
  <g transform="translate(422, 90)">
    <circle cx="0" cy="0" r="36" fill="#00E676" opacity="0.25" filter="url(#glow1)"/>
    <circle cx="0" cy="0" r="24" fill="#00E676" opacity="0.4"/>
    <circle cx="0" cy="0" r="16" fill="#00E676" stroke="#FFFFFF" stroke-width="4.5"/>
    <circle cx="-3.5" cy="-3.5" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>