  <!-- Tracks in Adobe Acrobat Red -->
  <polygon points="196,358 216,358 182,442 160,442" fill="#F40F02"/>
  <polygon points="296,358 316,358 352,442 330,442" fill="#F40F02"/>
  <rect x="194" y="368" width="124" height="14" rx="7" fill="#F40F02"/>
  <rect x="180" y="396" width="152" height="15" rx="7.5" fill="#F40F02"/>
  <rect x="164" y="424" width="184" height="16" rx="8" fill="#F40F02"/>

  <!-- Glowing Live Dot Beacon at 2 o'clock -->
  <g transform="translate(422, 90)">
    <circle cx="0" cy="0" r="36" fill="#00E676" opacity="0.25" filter="url(#adobeGlow4)"/>
    <circle cx="0" cy="0" r="24" fill="#00E676" opacity="0.4"/>
    <circle cx="0" cy="0" r="16" fill="#00E676" stroke="#FFFFFF" stroke-width="4.5"/>
    <circle cx="-3.5" cy="-3.5" r="4" fill="#FFFFFF" opacity="0.9"/>
