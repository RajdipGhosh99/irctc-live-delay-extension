<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="adobeGlow4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Ring in Adobe Acrobat Red -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#F40F02" stroke-width="26"/>

  <!-- Train Upper Canopy in Adobe Acrobat Red -->
  <rect x="206" y="112" width="100" height="24" rx="10" fill="#F40F02"/>
  <path d="M 156 180 C 156 142, 180 128, 216 128 L 296 128 C 332 128, 356 142, 356 180 L 356 200 L 156 200 Z" fill="#F40F02"/>

  <!-- Saffron Aerodynamic Visor Brow -->
  <rect x="180" y="142" width="152" height="6" rx="3" fill="#FF7700"/>

  <!-- Clean White Cockpit Section -->
  <rect x="156" y="200" width="200" height="74" fill="#FFFFFF" stroke="#F40F02" stroke-width="8"/>

  <!-- Windshield Cutout in Deep Obsidian -->
  <rect x="178" y="152" width="156" height="64" rx="12" fill="#0F172A"/>

