<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="liveDotGlow4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#000000" stroke-width="26"/>

  <!-- Indian Tricolor Perimeter Arcs -->
  <path d="M 68 140 A 216 216 0 0 1 444 140" fill="none" stroke="#FF9933" stroke-width="14" stroke-linecap="round"/>
  <path d="M 444 372 A 216 216 0 0 1 68 372" fill="none" stroke="#138808" stroke-width="14" stroke-linecap="round"/>

  <!-- Clock Hour Ticks on Ring Perimeter -->
  <line x1="256" y1="48" x2="256" y2="76" stroke="#000000" stroke-width="12" stroke-linecap="round"/> <!-- 12 -->
  <line x1="436" y1="256" x2="464" y2="256" stroke="#000000" stroke-width="12" stroke-linecap="round"/> <!-- 3 -->
  <line x1="48" y1="256" x2="76" y2="256" stroke="#000000" stroke-width="12" stroke-linecap="round"/> <!-- 9 -->
  <line x1="128" y1="128" x2="108" y2="108" stroke="#000000" stroke-width="10" stroke-linecap="round"/> <!-- 10 -->

  <!-- Clock Hands (Tracking Delay / Time) -->
  <line x1="256" y1="200" x2="182" y2="140" stroke="#000000" stroke-width="18" stroke-linecap="round"/>
  <line x1="256" y1="200" x2="332" y2="128" stroke="#000000" stroke-width="14" stroke-linecap="round"/>

  <!-- Front Elevation of Indian Train in Lower Center -->
  <g id="train-front">
    <path d="M 186 210 C 186 186, 204 178, 256 178 C 308 178, 326 186, 326 210 L 332 316 C 332 328, 322 336, 310 336 L 202 336 C 190 336, 180 328, 180 316 Z" fill="#000000"/>

    <!-- Windshield Cutout -->
    <rect x="202" y="196" width="108" height="42" rx="6" fill="#FFFFFF"/>
    <rect x="252" y="196" width="8" height="42" fill="#000000"/>

    <!-- Twin Round Headlights -->
    <circle cx="216" cy="268" r="16" fill="#FFFFFF"/>
    <circle cx="296" cy="268" r="16" fill="#FFFFFF"/>

    <!-- Vertical Radiator Grille -->
    <rect x="244" y="254" width="6" height="32" rx="3" fill="#FFFFFF"/>
    <rect x="253" y="252" width="6" height="36" rx="3" fill="#FFFFFF"/>
    <rect x="262" y="254" width="6" height="32" rx="3" fill="#FFFFFF"/>

    <!-- Tricolor Decal -->
    <rect x="204" y="310" width="104" height="4" fill="#FF9933" rx="1"/>
    <rect x="204" y="314" width="104" height="4" fill="#FFFFFF"/>
    <rect x="204" y="318" width="104" height="4" fill="#138808" rx="1"/>
  </g>

  <!-- Ground Converging Railway Track Rails -->
  <polygon points="214,346 230,346 176,448 154,448" fill="#000000"/>
  <polygon points="282,346 298,346 358,448 336,448" fill="#000000"/>
  <rect x="200" y="364" width="112" height="14" rx="4" fill="#000000"/>
  <rect x="188" y="392" width="136" height="15" rx="4" fill="#000000"/>
  <rect x="172" y="422" width="168" height="17" rx="4" fill="#000000"/>

  <!-- LIVE STATUS DOT BEACON (Emerald Green Glow at 2 o'clock) -->
  <g transform="translate(366, 96)">
    <circle cx="0" cy="0" r="32" fill="#10B981" opacity="0.3" filter="url(#liveDotGlow4)"/>
    <circle cx="0" cy="0" r="22" fill="#10B981" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="-5" cy="-5" r="5" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
