<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Circular Outer Border Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#000000" stroke-width="32"/>

  <!-- Clock Hour Ticks on Ring Perimeter -->
  <line x1="256" y1="44" x2="256" y2="76" stroke="#000000" stroke-width="12" stroke-linecap="round"/> <!-- 12 -->
  <line x1="436" y1="256" x2="468" y2="256" stroke="#000000" stroke-width="12" stroke-linecap="round"/> <!-- 3 -->
  <line x1="44" y1="256" x2="76" y2="256" stroke="#000000" stroke-width="12" stroke-linecap="round"/> <!-- 9 -->
  <line x1="384" y1="128" x2="408" y2="104" stroke="#000000" stroke-width="10" stroke-linecap="round"/> <!-- 2 -->
  <line x1="128" y1="128" x2="104" y2="104" stroke="#000000" stroke-width="10" stroke-linecap="round"/> <!-- 10 -->

  <!-- Clock Hands (Representing Punctuality & Delay Tracking) -->
  <!-- Hour hand pointing to 10 o'clock -->
  <line x1="256" y1="200" x2="175" y2="135" stroke="#000000" stroke-width="18" stroke-linecap="round"/>
  <!-- Minute hand pointing to 2 o'clock -->
  <line x1="256" y1="200" x2="340" y2="115" stroke="#000000" stroke-width="14" stroke-linecap="round"/>

  <!-- Live Signal Dot Beacon (Upper Right) -->
  <circle cx="360" cy="95" r="24" fill="#000000"/>
  <circle cx="360" cy="95" r="14" fill="#FFFFFF"/>
  <circle cx="360" cy="95" r="7" fill="#000000"/>

  <!-- Front Elevation of Indian Train in Lower Center -->
  <g id="train-front">
    <!-- Cabin Body -->
    <path d="M 186 210 C 186 186, 204 178, 256 178 C 308 178, 326 186, 326 210 L 332 316 C 332 328, 322 336, 310 336 L 202 336 C 190 336, 180 328, 180 316 Z" fill="#000000"/>

    <!-- Windshield Cutout -->
    <rect x="202" y="196" width="108" height="42" rx="6" fill="#FFFFFF"/>
    <rect x="252" y="196" width="8" height="42" fill="#000000"/>

    <!-- Twin Round Headlights -->
    <circle cx="216" cy="268" r="16" fill="#FFFFFF"/>
    <circle cx="296" cy="268" r="16" fill="#FFFFFF"/>

    <!-- Vertical Radiator Grille -->
    <rect x="244" y="254" width="6" height="32" rx="3" fill="#FFFFFF"/>
    <rect x="253" y="252" width="6" height="36" rx="3" fill="#FFFFFF"/>
    <rect x="262" y="254" width="6" height="32" rx="3" fill="#FFFFFF"/>

    <!-- Lower Cowcatcher Accent -->
    <rect x="198" y="312" width="116" height="10" rx="5" fill="#FFFFFF"/>
  </g>

  <!-- Ground Converging Railway Track Rails -->
  <polygon points="214,346 230,346 176,448 154,448" fill="#000000"/>
  <polygon points="282,346 298,346 358,448 336,448" fill="#000000"/>
  <rect x="200" y="364" width="112" height="14" rx="4" fill="#000000"/>
  <rect x="188" y="392" width="136" height="15" rx="4" fill="#000000"/>
  <rect x="172" y="422" width="168" height="17" rx="4" fill="#000000"/>
</svg>
