<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="squircleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bentoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7700"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
    <linearGradient id="bentoBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
  </defs>

  <!-- Modern iOS Squircle Superellipse Frame -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bentoBg)" stroke="url(#bentoBorder)" stroke-width="18"/>

  <!-- Inner Train Glyph in Pure Crisp White -->
  <g transform="translate(0, -6)">
    <!-- Roof Cap -->
    <rect x="210" y="118" width="92" height="20" rx="8" fill="#FFFFFF"/>
    <!-- Cabin -->
    <rect x="162" y="132" width="188" height="188" rx="34" fill="#FFFFFF"/>
    <!-- Windshield Cutout (Dark inside) -->
    <rect x="182" y="152" width="148" height="70" rx="12" fill="#090D16"/>
    <!-- Headlights -->
    <circle cx="202" cy="270" r="20" fill="#090D16"/>
    <circle cx="310" cy="270" r="20" fill="#090D16"/>
    <!-- 3 Radiator Pills -->
    <rect x="242" y="250" width="8" height="38" rx="4" fill="#090D16"/>
    <rect x="252" y="246" width="8" height="46" rx="4" fill="#090D16"/>
    <rect x="262" y="250" width="8" height="38" rx="4" fill="#090D16"/>

    <!-- Tracks & Sleepers -->
    <polygon points="202,336 220,336 188,430 168,430" fill="#FFFFFF"/>
    <polygon points="292,336 310,336 344,430 324,430" fill="#FFFFFF"/>
    <rect x="200" y="350" width="112" height="14" rx="7" fill="#FFFFFF"/>
    <rect x="186" y="380" width="140" height="15" rx="7.5" fill="#FFFFFF"/>
    <rect x="172" y="412" width="168" height="16" rx="8" fill="#FFFFFF"/>
  </g>

  <!-- Floating Live Pulse Beacon (Top Right Corner) -->
  <g transform="translate(416, 96)">
    <circle cx="0" cy="0" r="32" fill="#00E676" opacity="0.3" filter="url(#squircleGlow)"/>
    <circle cx="0" cy="0" r="20" fill="#00E676" stroke="#090D16" stroke-width="4.5"/>
    <circle cx="-3" cy="-3" r="3.5" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>