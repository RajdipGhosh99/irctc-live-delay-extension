<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>

    <!-- Train Body Shading Gradient -->
    <linearGradient id="trainBodyGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Vande Bharat Navy Accent -->
    <linearGradient id="vbBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002B7F"/>
      <stop offset="100%" stop-color="#0056D2"/>
    </linearGradient>

    <!-- Tricolor Gradients -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#0A5C05"/>
    </linearGradient>

    <!-- Live Status Glow -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Icon Squircle Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad1)" stroke="#334155" stroke-width="4"/>

  <!-- Tricolor Speed Rails (Curving Perspective) -->
  <path d="M -20 420 C 140 380, 280 320, 532 230 L 532 260 C 280 350, 140 410, -20 450 Z" fill="url(#saffronGrad)"/>
  <path d="M -20 440 C 140 400, 280 340, 532 250 L 532 270 C 280 360, 140 420, -20 460 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M -20 455 C 140 415, 280 355, 532 265 L 532 295 C 280 385, 140 445, -20 485 Z" fill="url(#greenGrad)"/>

  <!-- Vande Bharat Train Nose & Body -->
  <g id="vande-bharat-train" transform="translate(10, -10)">
    <!-- Aerodynamic Cabin Roof -->
    <path d="M 120 280 C 110 240, 140 160, 210 130 C 270 105, 390 145, 510 215 L 510 290 C 420 240, 310 220, 250 250 C 210 270, 170 310, 120 280 Z" fill="url(#trainBodyGrad)"/>

    <!-- Aerodynamic Windshield Window -->
    <path d="M 175 190 C 190 155, 240 135, 275 145 L 340 170 C 310 190, 270 205, 210 215 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
    <!-- Windshield Reflection -->
    <path d="M 235 152 L 270 165 C 240 185, 210 195, 188 200 Z" fill="#38BDF8" opacity="0.4"/>

    <!-- Saffron Forehead Strip -->
    <path d="M 215 130 C 240 120, 285 130, 305 140 L 300 148 C 280 140, 240 130, 210 140 Z" fill="url(#saffronGrad)"/>

    <!-- Blue Racing Band (Vande Bharat Livery) -->
    <path d="M 124 278 C 145 250, 185 240, 240 235 L 510 260 L 510 278 L 240 252 C 180 258, 140 275, 124 278 Z" fill="url(#vbBlue)"/>

    <!-- Lower Cowcatcher / Deflector -->
    <path d="M 130 282 L 150 330 C 180 340, 220 330, 240 315 L 235 295 C 190 310, 150 300, 130 282 Z" fill="#002B7F"/>
    <path d="M 150 330 L 160 348 C 190 355, 220 345, 235 332 L 230 320 Z" fill="#E2E8F0"/>

    <!-- Dual Sharp Headlights -->
    <ellipse cx="160" cy="275" rx="8" ry="14" transform="rotate(-25 160 275)" fill="#FEF08A"/>
    <ellipse cx="230" cy="290" rx="7" ry="12" transform="rotate(10 230 290)" fill="#FEF08A"/>
  </g>

  <!-- Live Pulse Beacon (On-Time Indicator) -->
  <g transform="translate(390, 370)">
    <circle cx="0" cy="0" r="28" fill="#10B981" opacity="0.25" filter="url(#glowGreen)"/>
    <circle cx="0" cy="0" r="18" fill="#10B981" filter="url(#glowGreen)"/>
    <circle cx="0" cy="0" r="8" fill="#ECFDF5"/>
  </g>
</svg>
