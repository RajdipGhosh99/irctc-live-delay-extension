<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="flagGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7700"/>
      <stop offset="38%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="62%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B248"/>
    </linearGradient>
    <filter id="glowDot2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Smooth Tricolor Gradient -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#flagGrad2)" stroke="#0F172A" stroke-width="12"/>

  <!-- Ashoka Chakra Watermark behind train -->
  <g transform="translate(256, 250)" opacity="0.16" stroke="#003399" stroke-width="3">
    <circle cx="0" cy="0" r="100" fill="none"/>
    <circle cx="0" cy="0" r="14" fill="#003399"/>
    <line x1="0" y1="-100" x2="0" y2="100"/>
    <line x1="-100" y1="0" x2="100" y2="0"/>
    <line x1="-70" y1="-70" x2="70" y2="70"/>
    <line x1="-70" y1="70" x2="70" y2="-70"/>
  </g>

  <!-- Pure Obsidian Train Body -->
  <g transform="translate(0, -6)">
    <!-- Roof Cap -->
    <rect x="206" y="112" width="100" height="24" rx="10" fill="#0F172A"/>
    <!-- Cabin -->
    <rect x="156" y="128" width="200" height="200" rx="36" fill="#0F172A"/>
    <!-- Windshield -->
    <rect x="178" y="148" width="156" height="74" rx="14" fill="#FFFFFF"/>

    <!-- Headlights -->
    <circle cx="198" cy="272" r="22" fill="#FFFFFF"/>
    <circle cx="198" cy="272" r="14" fill="#0F172A"/>
    <circle cx="314" cy="272" r="22" fill="#FFFFFF"/>
    <circle cx="314" cy="272" r="14" fill="#0F172A"/>

    <!-- 3 Radiator Pills in Navy -->
    <rect x="240" y="252" width="8" height="40" rx="4" fill="#003399"/>
    <rect x="252" y="248" width="8" height="48" rx="4" fill="#003399"/>
    <rect x="264" y="252" width="8" height="40" rx="4" fill="#003399"/>

    <!-- Tracks & Sleepers -->
    <polygon points="196,344 216,344 182,442 160,442" fill="#0F172A"/>
    <polygon points="296,344 316,344 352,442 330,442" fill="#0F172A"/>
    <rect x="194" y="358" width="124" height="14" rx="7" fill="#0F172A"/>
    <rect x="180" y="388" width="152" height="15" rx="7.5" fill="#0F172A"/>
    <rect x="164" y="420" width="184" height="16" rx="8" fill="#0F172A"/>
  </g>

  <!-- Glowing Live Dot Beacon -->
  <g transform="translate(420, 92)">
    <circle cx="0" cy="0" r="32" fill="#00E676" opacity="0.35" filter="url(#glowDot2)"/>
    <circle cx="0" cy="0" r="20" fill="#00E676" stroke="#FFFFFF" stroke-width="4.5"/>
    <circle cx="-3.5" cy="-3.5" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>