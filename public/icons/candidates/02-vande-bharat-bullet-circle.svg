<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="liveDotGlow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Border Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#000000" stroke-width="32"/>

  <!-- Vande Bharat Aerodynamic Streamlined Nose & Body -->
  <path d="M 256 100 C 210 100, 168 150, 164 240 L 160 326 C 160 338, 172 346, 186 346 L 326 346 C 340 346, 352 338, 352 326 L 348 240 C 344 150, 302 100, 256 100 Z" fill="#000000"/>

  <!-- Wrap-Around Visor Windshield (Negative Space) -->
  <path d="M 256 138 C 220 138, 194 165, 186 210 L 326 210 C 318 165, 292 138, 256 138 Z" fill="#FFFFFF"/>

  <!-- Indian Saffron Forehead Strip Accent -->
  <rect x="230" y="114" width="52" height="12" rx="6" fill="#FF9933"/>

  <!-- Center Aero Nose Divider Line -->
  <line x1="256" y1="210" x2="256" y2="288" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>

  <!-- Sleek Angular Wing Headlights (Negative Space Cutouts) -->
  <polygon points="184,260 216,275 210,290 180,275" fill="#FFFFFF"/>
  <polygon points="328,260 296,275 302,290 332,275" fill="#FFFFFF"/>

  <!-- Lower Aerodynamic Air Dam / Deflector Cutout -->
  <path d="M 206 318 L 256 332 L 306 318 L 302 328 L 256 340 L 210 328 Z" fill="#FFFFFF"/>

  <!-- Indian Tricolor Tracks (Perspective Foundation) -->
  <!-- Left Rail in Saffron -->
  <polygon points="210,358 228,358 174,446 152,446" fill="#FF9933"/>
  <!-- Right Rail in Green -->
  <polygon points="284,358 302,358 360,446 338,446" fill="#138808"/>

  <!-- Black Railway Sleepers -->
  <rect x="200" y="372" width="112" height="14" rx="4" fill="#000000"/>
  <rect x="186" y="398" width="140" height="16" rx="4" fill="#000000"/>
  <rect x="170" y="426" width="172" height="18" rx="4" fill="#000000"/>

  <!-- LIVE STATUS DOT BEACON (Emerald Green Glow with White Ring) -->
  <g transform="translate(408, 104)">
    <circle cx="0" cy="0" r="32" fill="#10B981" opacity="0.28" filter="url(#liveDotGlow2)"/>
    <circle cx="0" cy="0" r="22" fill="#10B981" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="-5" cy="-5" r="5" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
