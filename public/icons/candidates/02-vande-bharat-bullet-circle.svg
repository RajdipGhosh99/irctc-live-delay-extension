<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="saffronGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7700"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <linearGradient id="greenGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>
  </defs>

  <!-- Concentric Indian Flag Orbit: 3 Layered Rings -->
  <!-- Outer Saffron Track (Top Half Orbit) -->
  <path d="M 38 256 A 218 218 0 0 1 474 256" fill="none" stroke="url(#saffronGrad2)" stroke-width="18" stroke-linecap="round"/>
  <!-- Middle White Precision Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#0F172A" stroke-width="4"/>
  <!-- Inner Green Track (Bottom Half Orbit) -->
  <path d="M 474 256 A 218 218 0 0 1 38 256" fill="none" stroke="url(#greenGrad2)" stroke-width="18" stroke-linecap="round"/>

  <!-- Pure High-Contrast Reference Train Body -->
  <rect x="206" y="112" width="100" height="24" rx="10" fill="#0F172A"/>
  <rect x="156" y="128" width="200" height="200" rx="36" fill="#0F172A"/>

  <!-- Windshield Cutout -->
  <rect x="178" y="148" width="156" height="74" rx="14" fill="#FFFFFF"/>

  <!-- Headlights -->
  <circle cx="198" cy="272" r="22" fill="#FFFFFF"/>
  <circle cx="314" cy="272" r="22" fill="#FFFFFF"/>

  <!-- 3 Radiator Pills in Ashoka Navy -->
  <rect x="240" y="252" width="8" height="40" rx="4" fill="#FFFFFF"/>
  <rect x="252" y="248" width="8" height="48" rx="4" fill="#FFFFFF"/>
  <rect x="264" y="252" width="8" height="40" rx="4" fill="#FFFFFF"/>

  <!-- Center Indian Flag Tri-Band Pill on Train Front -->
  <g transform="translate(216, 308)">
    <rect x="0" y="0" width="26" height="6" rx="3" fill="#FF7700"/>
    <rect x="26" y="0" width="28" height="6" fill="#FFFFFF"/>
    <circle cx="40" cy="3" r="2" fill="#003399"/>
    <rect x="54" y="0" width="26" height="6" rx="3" fill="#00E676"/>
  </g>

  <!-- Tracks & Sleepers -->
  <polygon points="196,344 216,344 182,442 160,442" fill="#0F172A"/>
  <polygon points="296,344 316,344 352,442 330,442" fill="#0F172A"/>
  <rect x="194" y="358" width="124" height="14" rx="7" fill="#0F172A"/>
  <rect x="180" y="388" width="152" height="15" rx="7.5" fill="#0F172A"/>
  <rect x="164" y="420" width="184" height="16" rx="8" fill="#0F172A"/>

  <!-- Glowing Live Dot Beacon at 2 o'clock -->
  <g transform="translate(422, 90)">
    <circle cx="0" cy="0" r="36" fill="#00E676" opacity="0.25" filter="url(#glow2)"/>
    <circle cx="0" cy="0" r="24" fill="#00E676" opacity="0.4"/>
    <circle cx="0" cy="0" r="16" fill="#00E676" stroke="#FFFFFF" stroke-width="4.5"/>
    <circle cx="-3.5" cy="-3.5" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>