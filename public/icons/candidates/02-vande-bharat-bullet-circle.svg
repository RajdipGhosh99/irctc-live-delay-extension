<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="heartGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A6D"/>
      <stop offset="100%" stop-color="#FF0055"/>
    </linearGradient>
  </defs>

  <!-- Sleek Circular Frame -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#0F172A" stroke-width="26"/>

  <!-- Top Roof Cap -->
  <rect x="206" y="112" width="100" height="24" rx="10" fill="#0F172A"/>

  <!-- Main Locomotive Cabin -->
  <rect x="156" y="128" width="200" height="200" rx="36" fill="#0F172A"/>

  <!-- Windshield -->
  <rect x="178" y="148" width="156" height="74" rx="14" fill="#FFFFFF"/>

  <!-- Headlights -->
  <circle cx="198" cy="268" r="21" fill="#FFFFFF"/>
  <circle cx="314" cy="268" r="21" fill="#FFFFFF"/>

  <!-- 3 Radiator Pills -->
  <rect x="240" y="248" width="8" height="40" rx="4" fill="#FFFFFF"/>
  <rect x="252" y="244" width="8" height="48" rx="4" fill="#FFFFFF"/>
  <rect x="264" y="248" width="8" height="40" rx="4" fill="#FFFFFF"/>

  <!-- Indian Tricolor Mini Decal Bar (Gen-Z Micro Badge) -->
  <g transform="translate(226, 308)">
    <rect x="0" y="0" width="20" height="6" rx="2" fill="#FF7700"/>
    <rect x="20" y="0" width="20" height="6" rx="0" fill="#FFFFFF"/>
    <rect x="40" y="0" width="20" height="6" rx="2" fill="#00E676"/>
  </g>

  <!-- Tracks -->
  <polygon points="196,344 216,344 182,442 160,442" fill="#0F172A"/>
  <polygon points="296,344 316,344 352,442 330,442" fill="#0F172A"/>
  <rect x="194" y="358" width="124" height="14" rx="7" fill="#0F172A"/>
  <rect x="180" y="388" width="152" height="15" rx="7.5" fill="#0F172A"/>
  <rect x="164" y="420" width="184" height="16" rx="8" fill="#0F172A"/>

  <!-- GEN-Z NEON LOVE DOT (Aesthetic Glowing Heart Badge at 2 o'clock) -->
  <g transform="translate(422, 90)">
    <!-- Pulse Aura -->
    <circle cx="0" cy="0" r="38" fill="#FF2A6D" opacity="0.25" filter="url(#heartGlow)"/>
    <circle cx="0" cy="0" r="26" fill="#FF2A6D" opacity="0.4"/>
    <!-- Love Heart Shape -->
    <path d="M 0 10 
             C -16 -6, -26 -18, -26 -28 
             C -26 -38, -16 -46, -5 -46 
             C 1 -46, 7 -42, 10 -38 
             C 13 -42, 19 -46, 25 -46 
             C 36 -46, 46 -38, 46 -28 
             C 46 -18, 36 -6, 20 10 
             Z" 
          transform="scale(0.55) translate(-10, 18)" 
          fill="url(#heartGrad)" 
          stroke="#FFFFFF" 
          stroke-width="4.5"
          filter="url(#heartGlow)"/>
    <!-- Cute Highlight Sparkle -->
    <circle cx="3" cy="-6" r="3" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>