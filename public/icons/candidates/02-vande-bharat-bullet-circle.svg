<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="adobeGlow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Frame in Adobe Acrobat Red -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#F40F02" stroke-width="26"/>
  
  <!-- Saffron Top Halo Arc -->
  <path d="M 80 150 A 226 226 0 0 1 432 150" fill="none" stroke="#FF7700" stroke-width="26" stroke-linecap="round"/>
  <!-- Green Bottom Foundation Arc -->
  <path d="M 432 362 A 226 226 0 0 1 80 362" fill="none" stroke="#00E676" stroke-width="26" stroke-linecap="round"/>

  <!-- Ashoka Chakra Dial Emblem overhead -->
  <g transform="translate(256, 88)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#003399" stroke-width="3"/>
    <circle cx="0" cy="0" r="4" fill="#003399"/>
    <line x1="0" y1="-17" x2="0" y2="17" stroke="#003399" stroke-width="2"/>
    <line x1="-17" y1="0" x2="17" y2="0" stroke="#003399" stroke-width="2"/>
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#003399" stroke-width="2"/>
    <line x1="-12" y1="12" x2="12" y2="-12" stroke="#003399" stroke-width="2"/>
  </g>

  <!-- Train Body in Adobe Acrobat Red -->
  <rect x="206" y="122" width="100" height="22" rx="9" fill="#F40F02"/>
  <rect x="156" y="136" width="200" height="196" rx="36" fill="#F40F02"/>

  <!-- Windshield -->
  <rect x="178" y="154" width="156" height="72" rx="14" fill="#FFFFFF"/>

  <!-- Headlights -->
  <circle cx="198" cy="274" r="22" fill="#FFFFFF"/>
  <circle cx="314" cy="274" r="22" fill="#FFFFFF"/>

  <!-- 3 Radiator Pills -->
  <rect x="240" y="254" width="8" height="38" rx="4" fill="#FFFFFF"/>
  <rect x="252" y="250" width="8" height="46" rx="4" fill="#FFFFFF"/>
  <rect x="264" y="254" width="8" height="38" rx="4" fill="#FFFFFF"/>

  <!-- Tracks & Sleepers in Adobe Acrobat Red -->
  <polygon points="196,346 216,346 182,442 160,442" fill="#F40F02"/>
  <polygon points="296,346 316,346 352,442 330,442" fill="#F40F02"/>
  <rect x="194" y="360" width="124" height="14" rx="7" fill="#F40F02"/>
  <rect x="180" y="390" width="152" height="15" rx="7.5" fill="#F40F02"/>
  <rect x="164" y="422" width="184" height="16" rx="8" fill="#F40F02"/>

  <!-- Glowing Live Dot Beacon at 2 o'clock -->
  <g transform="translate(422, 90)">
    <circle cx="0" cy="0" r="36" fill="#00E676" opacity="0.25" filter="url(#adobeGlow2)"/>
    <circle cx="0" cy="0" r="24" fill="#00E676" opacity="0.4"/>
    <circle cx="0" cy="0" r="16" fill="#00E676" stroke="#FFFFFF" stroke-width="4.5"/>
    <circle cx="-3.5" cy="-3.5" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>